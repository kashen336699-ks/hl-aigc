<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061426"/>
      <stop offset="0.55" stop-color="#071a30"/>
      <stop offset="1" stop-color="#030b17"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="45%" r="65%">
      <stop offset="0" stop-color="#10375c" stop-opacity=".30"/>
      <stop offset="1" stop-color="#061426" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowBlue" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowPurple" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowGreen" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowWhite" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ecf7ff"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#37b9ff"/>
    </marker>
    <marker id="arrowMagenta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb60d2"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff9d24"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #eef8ff; }
      .muted { fill: #a9bdd0; }
      .tiny { font-size: 13px; }
      .small { font-size: 15px; }
      .body { font-size: 17px; }
      .nodeTitle { font-size: 18px; font-weight: 700; }
      .sectionTitle { font-size: 26px; font-weight: 800; fill: #7ee7ff; }
      .section { fill: #061528; fill-opacity: .70; stroke: #245277; stroke-width: 1.4; rx: 14; }
      .boundary { fill: #071a2b; fill-opacity: .48; stroke: #a8bed0; stroke-width: 1.7; stroke-dasharray: 7 6; rx: 14; }
      .private { fill: #061f30; fill-opacity: .45; stroke: #37b9ff; stroke-width: 1.5; stroke-dasharray: 7 5; rx: 12; }
      .cardBlue { fill: #091d34; stroke: #39baff; stroke-width: 1.8; rx: 12; filter: url(#glowBlue); }
      .cardPurple { fill: #15142e; stroke: #d461ff; stroke-width: 1.8; rx: 12; filter: url(#glowPurple); }
      .cardGreen { fill: #102b24; stroke: #64e58a; stroke-width: 1.7; rx: 12; filter: url(#glowGreen); }
      .cardOrange { fill: #30200c; stroke: #ff9d24; stroke-width: 1.8; rx: 12; filter: url(#glowPurple); }
      .cardPink { fill: #2b1328; stroke: #fb60d2; stroke-width: 1.7; rx: 12; filter: url(#glowPurple); }
      .line { fill: none; stroke: #ecf7ff; stroke-width: 2.1; marker-end: url(#arrowWhite); }
      .lineBoth { fill: none; stroke: #ecf7ff; stroke-width: 2.1; marker-start: url(#arrowWhite); marker-end: url(#arrowWhite); }
      .service { fill: none; stroke: #37b9ff; stroke-width: 2.1; stroke-dasharray: 7 5; marker-end: url(#arrowBlue); }
      .secret { fill: none; stroke: #fb60d2; stroke-width: 2.1; stroke-dasharray: 7 5; marker-end: url(#arrowMagenta); }
      .ci { fill: none; stroke: #ff9d24; stroke-width: 2.2; stroke-dasharray: 8 5; marker-end: url(#arrowOrange); }
      .githubPath { fill: none; stroke: #fb60d2; stroke-width: 2.2; marker-end: url(#arrowMagenta); }
      .llmPath { fill: none; stroke: #37b9ff; stroke-width: 2.2; marker-end: url(#arrowBlue); }
      .pill { fill: #09223b; stroke: #37b9ff; stroke-width: 1.2; rx: 13; }
